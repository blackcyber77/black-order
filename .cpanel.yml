---
deployment:
  tasks:
    # Deploy Laravel (auto-detect path + binary)
    - export PROJECTPATH="${PROJECTPATH:-$(pwd)}"
    - export PHP_BIN="${PHP_BIN:-$(command -v php || echo /usr/local/bin/php)}"
    - export COMPOSER_BIN="${COMPOSER_BIN:-$(command -v composer || echo /usr/local/bin/composer)}"

    # 1) Install dependencies production
    - cd "$PROJECTPATH" && "$COMPOSER_BIN" install --no-dev --optimize-autoloader --no-interaction 2>&1

    # 2) Migrate database
    - cd "$PROJECTPATH" && "$PHP_BIN" artisan migrate --force 2>&1

    # 3) Ensure storage symlink
    - cd "$PROJECTPATH" && "$PHP_BIN" artisan storage:link 2>&1 || true

    # 4) Clear & rebuild cache
    - cd "$PROJECTPATH" && "$PHP_BIN" artisan optimize:clear 2>&1
    - cd "$PROJECTPATH" && "$PHP_BIN" artisan config:cache 2>&1
    - cd "$PROJECTPATH" && "$PHP_BIN" artisan route:cache 2>&1
    - cd "$PROJECTPATH" && "$PHP_BIN" artisan view:cache 2>&1
